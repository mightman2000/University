<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Save Test</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>

<body>

<div class="container">

    <h3>Test Directory</h3>
    <hr>

    <p class="h4 mb-4">Save Test</p>

    <form action="#" th:action="@{/test/save}"
          th:object="${test}" method="POST">

        <input type="hidden" th:field="*{id}">

        <input type="text" th:field="*{name}"
               class="form-control mb-4 w-25" placeholder="Name">

        <input type="checkbox" th:field="*{randomized}"
               class="form-control mb-4 w-25" placeholder="Is randomized">

        <input type="text" th:field="*{singleClosed}"
               class="form-control mb-4 w-25" placeholder="Name">


        <button type="submit" class="btn btn-info col-2">Save</button>

    </form>

    <hr>
      <a th:href="@{/test/overview}">Back to Test overview</a>
</div>

</body>

</html>
