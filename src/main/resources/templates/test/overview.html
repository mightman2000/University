<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Test Overview</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>

<div class="container">

    <h3>Test overview</h3>
    <hr>

    <a th:href="@{/test/add}"
       class="btn btn-primary btn-sm mb-3">
        Add Test
    </a>

    <table class="table table-bordered table-striped">

        <thead class="table-dark">

        <tr>
            <th>Id</th>
            <th>Name</th>
            <th>Questions Count</th>
            <th>Randomized</th>
        </tr>

        </thead>

        <tbody>
        <tr th:each="tempTest : ${test}">

            <td th:text="${tempTest.id}"></td>
            <td th:text="${tempTest.name}"></td>
            <td th:text="${tempTest.singleClosedCount + tempTest.multipleClosedCount + tempTest.OpenCount}"></td>
            <td th:text="${tempTest.randomized}"></td>
            <td>

                <a th:href="@{/test/details(testId=${tempTest.id})}"
                   class="btn btn-info btn-sm">
                    Details
                </a>

                <a th:href="@{/test/update(testId=${tempTest.id})}"
                   class="btn btn-info btn-sm">
                    Update
                </a>

                <a th:href="@{/test/delete(testId=${tempTest.id})}"
                   class="btn btn-danger btn-sm"
                   onclick="if (!(confirm('Are you sure you want to delete this Test'))) return false">

                    Delete
                </a>

            </td>
        </tr>
        </tbody>

    </table>
    <a th:href="@{/home}">Back to Home</a>

</div>

</body>
</html>
